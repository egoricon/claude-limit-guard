<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="820" height="300" rx="18" fill="#1F1E1D"/>
  <text x="40" y="58" fill="#F4F1EA" font-size="26" font-weight="700">Limit Guard</text>
  <text x="40" y="86" fill="#A8A29A" font-size="15">Stops long autonomous Claude Code tasks before they burn your 5-hour limit.</text>
  <!-- prompt box -->
  <rect x="40" y="118" width="740" height="84" rx="14" fill="#2B2A28" stroke="#3D3B38"/>
  <text x="64" y="152" fill="#7C766E" font-size="15">Refactor the whole project and write tests…</text>
  <text x="64" y="186" fill="#A8A29A" font-size="20">+</text>
  <!-- bar: watching -->
  <rect x="430" y="178" width="120" height="4" rx="2" fill="#9A9A9A" opacity=".35"/>
  <rect x="430" y="178" width="66" height="4" rx="2" fill="#E8803A"/>
  <rect x="513" y="172" width="2" height="16" rx="1" fill="#E8803A"/>
  <circle cx="496" cy="180" r="6" fill="#E8803A"/>
  <text x="562" y="185" fill="#A8A29A" font-size="14">55% / 70%</text>
  <text x="690" y="185" fill="#A8A29A" font-size="14">Claude ▾</text>
  <!-- states -->
  <g font-size="14" fill="#C9C3BA">
    <circle cx="52" cy="244" r="6" fill="#E8803A"/><text x="66" y="249">watching</text>
    <circle cx="182" cy="244" r="6" fill="#D93F3F"/><text x="196" y="249">stopped at threshold</text>
    <circle cx="382" cy="244" r="5" fill="none" stroke="#9A9A9A" stroke-width="1.6"/><text x="396" y="249">you said “continue” → runs to 100%</text>
  </g>
  <text x="40" y="280" fill="#6E6860" font-size="12">Per-chat · zero tokens spent on checks · threshold 30–95%</text>
</svg>
